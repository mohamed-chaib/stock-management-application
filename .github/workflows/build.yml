name: Build Electron App

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ─── Windows Build (MUST run on windows-latest) ──────────────────────────
  # Native modules (.node files) are compiled with MSVC on Windows.
  # Cross-compiling from Linux produces Linux ELF binaries → crash on Windows.
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22          # Must match local dev environment
          cache: npm

      - name: Install dependencies
        run: npm ci                 # Reproducible install from package-lock.json

      - name: Build Windows app
        run: npm run build:win
        env:
          # Needed by electron-builder for some operations
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: release/*.exe

  # ─── Linux Build ─────────────────────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Linux app
        run: npm run build:linux

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: |
            release/*.AppImage
            release/*.deb